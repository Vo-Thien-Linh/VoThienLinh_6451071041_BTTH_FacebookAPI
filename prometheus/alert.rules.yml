groups:
  - name: kafka_alerts
    rules:
      - alert: DeadLetterQueueReceived
        expr: kafka_topic_partition_current_offset{topic="dead_letter"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Message moi vao Dead Letter Queue"
          description: "Topic dead_letter dang co message. Kiem tra Kafka UI tai http://localhost:8080 de xem noi dung va xu ly thu cong."

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lag cao bat thuong"
          description: "Consumer group {{ $labels.consumergroup }} dang lag {{ $value }} message tren topic {{ $labels.topic }}."

      - alert: WebhookReceiverSilent
        expr: increase(kafka_topic_partition_current_offset{topic="raw_events"}[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Khong co event Facebook trong 10 phut"
          description: "Topic raw_events khong co message moi. Kiem tra Facebook Webhook subscription va webhook-service."
